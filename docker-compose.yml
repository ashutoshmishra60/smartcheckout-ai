version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: retail-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: retail_checkout
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - mysql_data:/var/lib/mysql

  # Python / Flask / YOLOv8 ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: retail-ml-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - YOLO_MODEL=yolov8n.pt
      - CONF_THRESHOLD=0.35

  # Node.js / Express Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=retail_checkout
      - ML_SERVICE_URL=http://ml-service:5001
    depends_on:
      - mysql
      - ml-service

  # React.js Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
